; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps = arduino-libraries/Servo
monitor_filters = send_on_enter
build_flags =
    -mcall-prologues
    -Wl,--relax
    -fno-inline-small-functions
    -fmerge-all-constants
    -fno-split-wide-types
    -fno-tree-sra
    -fno-gcse
    -fno-tree-dominator-opts
    -fno-move-loop-invariants


; Diagnostic builds only. The production [env:uno] stays unchanged.
[env:uno_timing20]
extends = env:uno
build_flags =
    ${env:uno.build_flags}
    -DMEARM_TIMING_DIAG

[env:uno_timing10]
extends = env:uno
build_flags =
    ${env:uno.build_flags}
    -DMEARM_TIMING_DIAG
    -DMEARM_TIMING_INTERVAL_MS=10


; Nano binary buttons: D10/PB2/PCINT0 + Timer2 RX; USB Serial stays 115200.
[env:uno_nano_link]
extends = env:uno
build_flags =
    ${env:uno.build_flags}
    -DMEARM_NANO_LINK
    -DMEARM_BUTTON_RX=10
    -DMEARM_BUTTON_BAUD=9600
    -Wl,-Map,.pio/build/uno_nano_link/firmware.map
