[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600
build_flags = -mcall-prologues -Wl,--relax

[env:nano_oled]
extends = env:nano
lib_deps = olikraus/U8g2 @ 2.36.17
build_flags =
    ${env:nano.build_flags}
    -DMEARM_NANO_OLED
    -DMEARM_OLED_ADDRESS=0x3C
